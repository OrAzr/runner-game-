<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2226">
<link rel="icon" href="data:,">
<title>Outpost Zero — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#1b2226;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #game{position:relative;margin:0 auto;height:100%;overflow:hidden}
  canvas{display:block}
  #hud{position:absolute;inset:0;pointer-events:none}
  #top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:10px}
  #progress{flex:1;height:12px;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
  #progressFill{height:100%;width:0;background:linear-gradient(90deg,#1f8a8a,#38d0d0)}
  .badge{font-weight:800;font-size:13px;letter-spacing:.06em;text-shadow:0 1px 2px #000}
  #muteBtn{pointer-events:auto;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;font-size:16px;padding:4px 8px}
  #weapon{position:absolute;top:calc(36px + env(safe-area-inset-top));left:12px;display:none;flex-direction:column;gap:4px;background:rgba(232,121,43,.9);color:#1b1b1b;padding:6px 10px;border-radius:10px;font-weight:900;font-size:13px;min-width:130px}
  #weaponBar{height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}#weaponTime{height:100%;background:#1b1b1b;width:100%}
  #bossBar{position:absolute;top:calc(40px + env(safe-area-inset-top));left:12px;right:12px;display:none}
  #bossBar .lbl{display:flex;justify-content:space-between;font-weight:900;font-size:14px;text-shadow:0 1px 3px #000;margin-bottom:3px}
  #bossTrack{height:16px;background:rgba(0,0,0,.55);border:2px solid #000;border-radius:6px;overflow:hidden}
  #bossFill{height:100%;width:100%;background:linear-gradient(90deg,#c0281e,#ff5a3a);transition:width .1s}
  #shieldBtn{pointer-events:auto;position:absolute;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;border:3px solid #38e0e0;background:radial-gradient(#1f8a8a,#0e3f40);color:#fff;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(56,224,224,.6)}
  #shieldBtn .ico{font-size:24px;line-height:1}
  #shieldBtn.cooling{filter:grayscale(.9) brightness(.7);box-shadow:none}
  #hint{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;font-weight:700;font-size:13px;opacity:.75;text-shadow:0 1px 3px #000}
  .pop{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-weight:900;font-size:30px;text-shadow:0 2px 6px #000;animation:pop .9s ease-out forwards;white-space:nowrap}
  .pop.good{color:#7fd0ff}.pop.bad{color:#ff6b5b}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(rgba(10,16,18,.55),rgba(10,16,18,.85));text-align:center;padding:24px;box-sizing:border-box}
  .overlay.hidden{display:none}
  h1{margin:0;font-size:44px;letter-spacing:.04em;color:#38d0d0;text-shadow:0 3px 0 #0e3f40,0 0 20px rgba(56,208,208,.4)}
  h1 span{color:#e8792b}
  .sub{opacity:.85;font-size:14px;max-width:300px;line-height:1.45}
  button.big{pointer-events:auto;font:inherit;font-weight:900;font-size:20px;letter-spacing:.08em;padding:14px 44px;border-radius:14px;border:none;background:#e8792b;color:#1b1b1b;box-shadow:0 5px 0 #8a4413}
  button.big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4413}
  #endTitle{font-size:48px;font-weight:900;margin:0}#endTitle.win{color:#7fd0ff}#endTitle.lose{color:#ff6b5b}
</style></head>
<body>
<div id="game">
  <div id="hud">
    <div id="top"><span class="badge">ROOK'S SQUAD</span><div id="progress"><div id="progressFill"></div></div><button id="muteBtn">🔊</button></div>
    <div id="weapon"><span id="weaponName">SHOTGUN</span><div id="weaponBar"><div id="weaponTime"></div></div></div>
    <div id="bossBar"><div class="lbl"><span>☠ BRUTE BOSS</span><span id="bossHp"></span></div><div id="bossTrack"><div id="bossFill"></div></div></div>
    <div id="shieldBtn"><span class="ico">🛡</span><span>SHIELD</span><span id="shieldCd">READY</span></div>
    <div id="hint">Drag to steer · shoot the gates</div>
  </div>
  <div id="menu" class="overlay">
    <h1>OUTPOST <span>ZERO</span></h1>
    <div class="sub">Lead Rook's squad up the road. Shoot the <b style="color:#ff6b5b">red numbered gates</b> until they turn <b style="color:#7fd0ff">blue</b>, then run through them. Grab crates and take down the boss.</div>
    <button id="playBtn" class="big">PLAY</button>
    <div class="sub" style="font-size:12px;opacity:.6">Prototype · sound on 🔊</div>
  </div>
  <div id="end" class="overlay hidden">
    <h2 id="endTitle">VICTORY</h2><div id="endStats" class="sub"></div>
    <button id="againBtn" class="big">PLAY AGAIN</button>
  </div>
</div>
<script src="game.js"></script>
</body></html>
